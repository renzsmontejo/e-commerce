
server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # FORWARD ANGULAR API REQUESTS TO SPRING BOOT
  location /api/ {
    client_max_body_size 51m;
    proxy_pass http://ecommerce-backend:8080;
  }

  # ANGULAR ROUTING
  location / {
    try_files $uri $uri/ /index.html;
  }
}

<header class="site-header">
  <!-- Announcement bar -->
  <div class="announce">
    <div class="container announce__inner">
      <p class="announce__promo">
        Get 50% Off on Selected Items
        <span class="announce__sep" aria-hidden="true">|</span>
        <a routerLink="/products" [queryParams]="{ sale: true }">Shop Now</a>
      </p>
      <a class="announce__phone" href="tel:+00115566890">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
        </svg>
        +00115566890
      </a>
    </div>
  </div>

  <!-- Main bar -->
  <div class="bar">
    <div class="container bar__row">
      <a routerLink="/" class="brand" aria-label="We Shop Smarter – home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="20" height="17" rx="8.5" fill="#7C83F7" />
          <rect x="11" y="14" width="20" height="17" rx="8.5" fill="#A5ABFF" />
          <rect x="8" y="10" width="16" height="12" rx="6" fill="#050505" opacity=".0" />
        </svg>
        <span class="brand__text">We Shop<br />Smarter</span>
      </a>

      <form class="search" role="search" (submit)="$event.preventDefault(); search(q.value)">
        <input #q class="search__input" type="search" placeholder="Search" aria-label="Search products" />
        <button class="search__btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </button>
      </form>

      <div class="actions">
        <a routerLink="/account/wishlist" class="icon-btn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.700 3.700 4.500 7 4.500c2 0 3.400 1.100 5 3 1.600-1.900 3-3 5-3 3.300 0 5.400 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400z" />
          </svg>
        </a>
        <a routerLink="/cart" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h2.200l2.300 11h10.500l2-8H6.200" />
            <circle cx="9" cy="19.500" r="1.200" />
            <circle cx="17" cy="19.500" r="1.200" />
          </svg>
          @if (cartCount() > 0) {
            <span class="badge">{{ cartCount() }}</span>
          }
        </a>
        <a routerLink="/account" class="icon-btn" aria-label="Account">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.200 3.600-7 8-7s8 2.800 8 7" />
          </svg>
        </a>
      </div>
    </div>

    <nav class="container nav" aria-label="Product categories">
      <a routerLink="/products" class="nav__all">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.500" />
          <rect x="14" y="3" width="7" height="7" rx="1.500" />
          <rect x="3" y="14" width="7" height="7" rx="1.500" />
          <rect x="14" y="14" width="7" height="7" rx="1.500" />
        </svg>
        All Categories
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </a>
      <span class="nav__divider" aria-hidden="true"></span>
      <ul class="nav__list">
        @for (link of navLinks; track link.slug) {
          <li>
            <a [routerLink]="['/products']" [queryParams]="{ category: link.slug }" routerLinkActive="is-active">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

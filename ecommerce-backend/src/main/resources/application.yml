spring:
  application:
    name: ecommerce
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3308/ecommerce_db}"
    username: "${DB_USERNAME:ecommerce_user}"
    password: "${DB_PASSWORD:Password@123}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: "${SMTP_HOST:localhost}"
    port: "${SMTP_PORT:1025}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail.smtp:
        auth: "${SMTP_AUTH:false}"
        starttls.enable: "${SMTP_STARTTLS:false}"
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 51MB
server:
  port: 8080
app:
  jwt:
    secret: "${JWT_SECRET}"
  auth:
    reset-url: "${PASSWORD_RESET_URL:http://localhost:4200/auth/reset-password}"
    mail-from: "${MAIL_FROM:no-reply@example.com}"
  checkout:
    shipping-fee: "${CHECKOUT_SHIPPING_FEE:0.00}"
    tax-rate: "${CHECKOUT_TAX_RATE:0}"
  paymongo:
    secret-key: "${PAYMONGO_SECRET_KEY:}"
    webhook-secret: "${PAYMONGO_WEBHOOK_SECRET:}"
    live-mode: "${PAYMONGO_LIVE_MODE:false}"
    success-url: "${PAYMONGO_SUCCESS_URL:http://localhost:4200/account?payment=success}"
    cancel-url: "${PAYMONGO_CANCEL_URL:http://localhost:4200/account?payment=cancelled}"
    payment-methods: "${PAYMONGO_PAYMENT_METHODS:gcash,card}"
    signature-tolerance-seconds: "${PAYMONGO_SIGNATURE_TOLERANCE_SECONDS:300}"
  catalog:
    image-directory: "${PRODUCT_IMAGE_DIRECTORY:./uploads/product-images}"
logging:
  level:
    org.springframework.security: TRACE
